# TEMPORARY helper for PR #426 (agent cannot run Gradle/npm locally). Remove before merging.
# Runs the real formatters and generators and prints the resulting patch (base64) to the log.
name: Format helper (temporary)

on:
  pull_request:

jobs:
  format-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Spotless apply
        run: ./gradlew spotlessApply || true

      - name: Compile server (main and test)
        run: ./gradlew :server:compileTestKotlin --continue || true

      - name: Regenerate OpenAPI contract snapshot
        run: UPDATE_SNAPSHOT=true ./gradlew :server:test --tests "io.github.simonhauck.openfirestationmanager.HttpApiContractIT" || true

      - name: Spotless apply (after snapshot)
        run: ./gradlew spotlessApply || true

      - name: Client install, bindings, format
        working-directory: client
        run: |
          npm ci
          npm run prepareEnv || true
          npm run format:fix || true

      - name: Client type check
        working-directory: client
        run: (npm run build && npm run build:check) || true

      - name: Print patch
        run: |
          git add -A
          git diff --cached --stat
          echo "=====PATCH BEGIN====="
          git diff --cached --binary | base64 -w0
          echo
          echo "=====PATCH END====="
