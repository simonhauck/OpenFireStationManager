name: On Release Tag

on:
  push:
    tags:
      - "v*"

jobs:
  run-tests:
    permissions:
      contents: read
    uses: ./.github/workflows/run-tests.yml

  publish-release:
    needs: run-tests
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Publish stable Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: ./gradlew :server:jib --no-daemon

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true

      - name: Trigger deployment webhook
        run: |
          if [ -z "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            echo "DEPLOY_WEBHOOK_URL is not configured for the production environment." >&2
            exit 1
          fi
          curl --fail --show-error --silent -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
