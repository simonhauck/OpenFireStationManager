name: On Main Push

on:
  push:
    branches:
      - main

jobs:
  run-tests:
    permissions:
      contents: read
    uses: ./.github/workflows/run-tests.yml

  publish-snapshot:
    needs: run-tests
    runs-on: ubuntu-latest
    environment: develop
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Publish Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: ./gradlew :server:jib --no-daemon

      - name: Trigger deployment webhook
        run: |
          if [ -z "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            echo "DEPLOY_WEBHOOK_URL is not configured for the develop environment." >&2
            exit 1
          fi
          curl --fail --show-error --silent -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
