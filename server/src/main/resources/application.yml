spring:
  application:
    name: OpenFireStationManager
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ofsm?user=postgres&password=postgres}
    hikari:
      minimum-idle: 0
      maximum-pool-size: 25
      idle-timeout: 30000 # release idle connections after 30 s → pool drains to 0
      connection-timeout: 30000 # wait up to 30 s for a connection (handles cold starts)
      initialization-fail-timeout: -1 # don't fail on startup if DB is scaled to 0
  security:
    oauth2:
      client:
        # Exactly one OpenID Connect provider. The defaults point at the local Keycloak from
        # infrastructure/local/docker-compose.yml. With issuer-uri, the provider metadata is
        # fetched at startup, so the server does not start while the provider is unreachable.
        registration:
          ofsm:
            provider: ofsm
            client-id: ${OIDC_CLIENT_ID:ofsm}
            client-secret: ${OIDC_CLIENT_SECRET:ofsm-dev-secret}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
        provider:
          ofsm:
            issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ofsm}
server:
  forward-headers-strategy: framework
  servlet:
    session:
      # Idle timeout: every request extends the session.
      timeout: ${SESSION_TIMEOUT:12h}
      cookie:
        name: OFSM_AUTH
        http-only: true
        secure: true
        # lax, not strict: the browser must send the cookie on the redirect back from the
        # provider, or the stored authorization request is lost and every login fails.
        same-site: lax

app:
  auth:
    username-claim: preferred_username
    roles:
      # OFSM role -> provider role names (claim realm_access.roles). Matches the realm roles of
      # the local Keycloak realm. Without a mapping, each OFSM role maps to the provider role of
      # the same name.
      mapping:
        ADMIN: [ofsm-admin]
        KLEIDERWART: [ofsm-kleiderwart]
        USER: [ofsm-user]

springdoc:
  model-converters:
    kotlin-nullable-property-customizer:
      enabled: false
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
    path: /schema.json

management:
  health:
    db:
      enabled: false

logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
