services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ..:/workspaces/OpenFireStationManager:cached
    command: sleep infinity
    depends_on:
      - db
      - keycloak
    networks:
      - devnet

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ofsm
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - devnet

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_PORT: "8180"
      # Issuer seen by the browser (forwarded port); the app container reaches it as http://keycloak:8180.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ../infrastructure/local/keycloak/ofsm-realm.json:/opt/keycloak/data/import/ofsm-realm.json:ro
    networks:
      - devnet

networks:
  devnet:

volumes:
  pgdata:
