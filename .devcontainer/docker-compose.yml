services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ..:/workspaces/OpenFireStationManager:cached
    command: sleep infinity
    depends_on:
      - db
    networks:
      - devnet

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ofsm
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - devnet

networks:
  devnet:

volumes:
  pgdata:
